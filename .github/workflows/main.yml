name: Build Animated Neon Radar

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repo
        uses: actions/checkout@v4

      - name: Check out plugin-sdk
        uses: actions/checkout@v4
        with:
          repository: dk22pac/plugin-sdk
          path: plugin-sdk

      - name: Install MinGW-w64 (32-bit) + CMake
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 cmake ninja-build

      - name: Configure
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=i686-w64-mingw32-gcc \
            -DCMAKE_CXX_COMPILER=i686-w64-mingw32-g++ \
            -DCMAKE_BUILD_TYPE=Release \
            -DPLUGIN_SDK_DIR="${{ github.workspace }}/plugin-sdk"

      - name: Build
        run: cmake --build build --config Release

      - name: Upload AnimatedNeonRadar.asi
        uses: actions/upload-artifact@v4
        with:
          name: AnimatedNeonRadar
          path: build/AnimatedNeonRadar.asi
          if-no-files-found: error
